# XcodeGen spec for Ebb. Generate the Xcode project with:
#   xcodegen generate
# (see docs/SETUP_GUIDE.md)
name: Ebb
options:
  bundleIdPrefix: com.ebbapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  EbbCore:
    path: Packages/EbbCore

fileGroups:
  - StoreKit

targets:
  Ebb:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Ebb
    dependencies:
      - package: EbbCore
        product: EbbCore
    info:
      path: Ebb/Info.plist
      properties:
        CFBundleDisplayName: Ebb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Ebb reads your sleep and Apple Watch wrist temperature to show them next to your symptoms. This data stays on your iPhone.
        NSHealthUpdateUsageDescription: Ebb saves the symptoms you log to Apple Health, if you choose to.
        NSFaceIDUsageDescription: Ebb uses Face ID to keep your health notes private.
    entitlements:
      path: Ebb/Ebb.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebbapp.ebb
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Simulator builds are signed locally, so no Apple Developer account is needed to run in the Simulator.
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      storeKitConfiguration: StoreKit/Ebb.storekit
      testTargets:
        - EbbUITests

  EbbUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EbbUITests
    dependencies:
      - target: Ebb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebbapp.ebb.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Ebb
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
